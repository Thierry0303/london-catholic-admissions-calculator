name: Auto-Update Catholic Schools Data

on:
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 4:00 UTC (~5am UK)
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Opt-in to Node.js 24 to avoid deprecation failures
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run data update script
        run: python update_data.py

      - name: Commit and push changes if any
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-updated Catholic schools data [ci skip]"
          file_pattern: catholic_schools_with_pan_coords.csv
