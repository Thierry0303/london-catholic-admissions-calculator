name: Update Catholic Schools Data

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9AM UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ← FIXES push permissions
    steps:
    - uses: actions/checkout@v5      # ← v5 = Node 24 ready
    
    - name: Set up Python
      uses: actions/setup-python@v5  # ← v5 = Node 24 ready
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install pandas requests
    
    - name: Run data update
      run: python update_data.py
    
    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add catholic_schools_with_pan_coords.csv
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update admissions data $(date +%Y-%m-%d)"
          git push
        fi
