name: Update Catholic Schools Data

on:
  workflow_dispatch:      # allow manual trigger
  schedule:
    - cron: "0 3 * * *"   # run daily at 03:00 UTC (03:00 London time in winter, 04:00 in summer)

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        run: python update_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catholic_schools_with_pan_coords.csv
          git commit -m "Auto-update Catholic schools data" || echo "No changes to commit"
          git push
