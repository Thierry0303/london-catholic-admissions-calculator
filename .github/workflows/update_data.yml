name: Update Catholic Schools Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (fresh clone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: DEBUG — show update_data.py content
        run: |
          echo "===== FILE CONTENT START ====="
          cat update_data.py
          echo "===== FILE CONTENT END ====="

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        run: python update_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catholic_schools_with_pan_coords.csv
          git commit -m "Auto-update Catholic schools data" || echo "No changes to commit"
          git push
